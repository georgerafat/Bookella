<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع الطلب - Bookella</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-white shadow-lg">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-gray-800">تتبع الطلب</h1>
      <a href="index.html" class="text-green-600 font-semibold">العودة للرئيسية</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10">
    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-xl font-bold mb-4">ادخل بيانات الطلب</h2>
      <form id="trackOrderForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2" for="trackingOrderId">رقم الطلب</label>
          <input id="trackingOrderId" class="w-full border rounded-lg px-3 py-2" placeholder="ORD-..." required>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2" for="trackingPhone">رقم الموبايل</label>
          <input id="trackingPhone" class="w-full border rounded-lg px-3 py-2" placeholder="01xxxxxxxxx" required>
        </div>
        <div class="md:col-span-2">
          <button class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">عرض حالة الطلب</button>
        </div>
      </form>

      <div id="trackingResult" class="hidden mt-8 border-t pt-6"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
